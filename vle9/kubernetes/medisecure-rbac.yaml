apiVersion: v1
kind: ServiceAccount
metadata:
  name: medisecure-viewer
  namespace: medisecure
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: medisecure-readonly
  namespace: medisecure
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: medisecure-readonly-binding
  namespace: medisecure
subjects:
  - kind: ServiceAccount
    name: medisecure-viewer
    namespace: medisecure
roleRef:
  kind: Role
  name: medisecure-readonly
  apiGroup: rbac.authorization.k8s.io
