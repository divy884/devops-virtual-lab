apiVersion: v1
kind: ServiceAccount
metadata:
  name: medisecure-sa
  namespace: medisecure
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medisecure
  namespace: medisecure
  labels:
    app: medisecure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: medisecure
  template:
    metadata:
      labels:
        app: medisecure
    spec:
      serviceAccountName: medisecure-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: medisecure
          image: medisecure:v4
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: APP_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: medisecure-secret
                  key: APP_SECRET_KEY
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medisecure-service
  namespace: medisecure
spec:
  selector:
    app: medisecure
  ports:
    - name: http
      port: 80
      targetPort: 5000
  type: NodePort
